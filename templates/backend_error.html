<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title|default('Request could not be completed') }} · RAMP Admin</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="error-page">
  <main class="panel error-card">
    <span class="placeholder-icon"><svg class="icon" aria-hidden="true"><use href="{{ url_for('static', filename='icons.svg') }}#icon-alert"></use></svg></span>
    <p class="eyebrow">{{ eyebrow|default('REQUEST ERROR') }}</p>
    <h1>{{ title|default("We couldn't complete that request") }}</h1>
    <p>{{ message }}</p>
    <a class="button button-secondary" href="{{ back_url|default(url_for('dashboard')) }}">{{ back_label|default('Back to dashboard') }}</a>
  </main>
</body>
</html>
